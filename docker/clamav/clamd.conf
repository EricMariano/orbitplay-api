# clamd config for local dev (mounted over the image default).
# Limits match MAX_BUILD_BYTES (1 GiB). Measured with ClamAV 1.5.4: a 1 GB
# stream scans clean, while 2 GB+ comes back as
# Heuristics.Limits.Exceeded.MaxFileSize even with higher settings — which is
# why the build cap is 1 GiB. Anything over a limit fails closed (unscannable).
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
User clamav

StreamMaxLength 1G
MaxFileSize 1G
MaxScanSize 4G
MaxRecursion 16
# Report a truncated/limit-hit scan as "Heuristics.Limits.Exceeded FOUND"
# instead of silently calling the file clean.
AlertExceedsMax yes

# Scanning a multi-GB stream is slow; don't drop the connection meanwhile.
ReadTimeout 600
CommandReadTimeout 600
MaxThreads 4
