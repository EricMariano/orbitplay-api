# Local infrastructure for the OrbitPlay API.
# The API itself runs on the HOST (pnpm dev), not in Docker.
#
#   docker compose -f docker/compose.yml up -d
#
# Services:
#   postgres  5432        main database
#   redis     6379        BullMQ queues + idempotency store
#   minio     9000/9001   S3-protocol object storage (console on 9001)
#   minio-init            one-shot: creates the dev bucket, then exits
#   mailhog   1025/8025   SMTP sink (web UI on 8025)

name: orbitplay

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitplay
      POSTGRES_PASSWORD: orbitplay
      POSTGRES_DB: orbitplay
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbitplay -d orbitplay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the dev bucket on boot, then exits (idempotent).
  #
  # SEC-06 hardening — the API only ever hands out presigned URLs (uploads
  # AND downloads), so the bucket has no legitimate reason to be publicly
  # readable; it stays private (no `mc anonymous set`). Two more safety nets
  # that don't depend on application code remembering to clean up:
  #   - AbortIncompleteMultipartUpload lifecycle rule: a multipart upload
  #     (recordings) that's abandoned mid-flight — client crash, network
  #     drop — otherwise leaves its already-uploaded parts consuming storage
  #     forever; MinIO's own scanner aborts anything still incomplete after
  #     a day, regardless of whether the app-level Redis session TTL (also
  #     ~1h, see RECORDING_UPLOAD_TTL_SECONDS) ever gets a chance to notice.
  #   - A hard bucket quota: caps total storage this dev bucket can consume
  #     so a runaway/abusive upload loop can't fill the disk unbounded.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/orbitplay-dev &&
      echo '{\"Rules\":[{\"ID\":\"abort-incomplete-multipart-uploads\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"\"},\"AbortIncompleteMultipartUpload\":{\"DaysAfterInitiation\":1}}]}' > /tmp/lifecycle.json &&
      mc ilm import local/orbitplay-dev < /tmp/lifecycle.json &&
      mc quota set local/orbitplay-dev --size 20GiB &&
      echo 'bucket orbitplay-dev ready (private, mpu-abort lifecycle, 20GiB quota)';
      "

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
