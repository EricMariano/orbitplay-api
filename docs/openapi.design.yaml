openapi: 3.0.3

info:
  title: OrbitPlay API — contrato de design
  version: 0.2.0-design
  description: |
    Contrato **de design** do backend do OrbitPlay, derivado de
    `docs/BACKEND-SPEC.md` (handoff v1.6). Serve para documentar e começar o
    desenvolvimento antes da implementação existir.

    ## Relação com `openapi.json`

    `openapi.json` na raiz do repositório é **gerado** a partir dos decorators
    do Nest (`pnpm openapi:generate`) e descreve apenas o que já está
    implementado. Este arquivo descreve o **alvo**. Conforme cada endpoint é
    implementado, ele passa a existir no `openapi.json` gerado — que continua
    sendo a fonte da verdade do que roda. Este YAML nunca é gerado; é editado à
    mão e vale como especificação.

    Endpoints já implementados estão marcados com `x-status: implemented`; os
    demais, com `x-status: todo`.

    ## Escopo

    Esta fase cobre a plataforma. Estão **fora**: cobrança do estúdio, carteira
    e saque do jogador, impulsionamento do feed, Orbit Plug-in e ingestão de
    telemetria, insights de IA e transcrição (ASR). Ver seção 10 da
    especificação.

    ## Convenções

    - **Tenancy:** toda rota autenticada é escopada pela organização do token.
      Recurso de outra organização responde `404`, nunca `403`, para não vazar
      existência.
    - **Papel:** vem da membership ativa carregada no access token, nunca do
      corpo da requisição.
    - **Erros:** envelope único `ErrorEnvelope` em toda falha.
    - **Paginação:** `?limit=&cursor=` devolvendo `{ data, nextCursor }`, com
      cursor opaco sobre UUIDv7. **Exceção:** o feed do jogador usa cursor de
      ranking congelado (ver `GET /player/feed`).
    - **Idempotência:** `Idempotency-Key` obrigatório onde indicado; repetir a
      chave reproduz a resposta original em vez de executar de novo.
    - **Valores monetários:** inteiros em centavos, com `currency` ISO-4217.
    - **Timestamps:** ISO-8601 UTC. Tempos dentro de uma sessão usam `tMs`,
      milissegundos desde o início da sessão.
  contact:
    name: OrbitPlay
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:3000
    description: Desenvolvimento local

security:
  - bearer: []

tags:
  - name: health
    description: Saúde e observabilidade (M15)
  - name: auth
    description: Autenticação e onboarding (M1)
  - name: orgs
    description: Organizações, membros e central de usuários (M2)
  - name: games
    description: Jogos do estúdio (M3)
  - name: test-models
    description: Catálogo de modelos de teste (M4)
  - name: tests
    description: Wizard de criação de teste (M5)
  - name: builds
    description: Builds (M6)
  - name: player-feed
    description: Feed do jogador e elegibilidade (M7)
  - name: participations
    description: Participações e sessões (M8)
  - name: media
    description: Mídia e gravação (M9)
  - name: reports
    description: Relatórios (M10)
  - name: dashboard
    description: Dashboard do estúdio (M11)
  - name: gamification
    description: XP, conquistas, missões e ranking (M12)
  - name: community
    description: Comunidade e avaliações (M13)
  - name: notifications
    description: Notificações (M14)

paths:
  # ---------------------------------------------------------------- M15 health
  /health:
    get:
      tags: [health]
      summary: Estado da API e das dependências
      description: |
        Verifica Postgres, Redis e object storage. Responde `503` quando alguma
        dependência está fora. A fila (BullMQ) ainda não entra na checagem.
      security: []
      x-status: implemented
      responses:
        '200':
          description: Todas as dependências disponíveis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: Alguma dependência indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }

  /health/ready:
    get:
      tags: [health]
      summary: Prontidão para receber tráfego
      description: |
        Diferente de `/health`: além de Postgres, Redis e storage, inclui a fila
        (BullMQ). Serve como readiness probe do deploy — uma instância que não
        consegue enfileirar job não deve receber tráfego.
      security: []
      x-status: todo
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: Ainda não pronto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }

  # ------------------------------------------------------------------ M1 auth
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar e abrir sessão
      description: |
        RN-02 (Tela 01): credencial inválida devolve erro **genérico** — a
        resposta não diferencia usuário inexistente de senha errada, e o tempo
        de resposta é equivalente nos dois casos.

        RN-03: a aba escolhida na UI não define o papel. A sessão é criada com o
        papel real da membership ativa.

        RN-04: `rememberMe` altera apenas o TTL do refresh token.

        O access token volta no corpo; o refresh token é setado como cookie
        `httpOnly`.
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              description: 'refresh_token (httpOnly, SameSite=Lax)'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotacionar a sessão
      description: |
        Lê o refresh token do cookie, rotaciona e emite novo par. Reuso de um
        token já rotacionado é tratado como comprometimento: a família de tokens
        inteira é revogada.
      security:
        - cookie: []
      x-status: implemented
      responses:
        '200':
          description: Sessão rotacionada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Encerrar a sessão
      security:
        - cookie: []
      x-status: implemented
      responses:
        '200':
          description: Sessão encerrada e cookie limpo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }

  /auth/me:
    get:
      tags: [auth]
      summary: Usuário autenticado
      x-status: implemented
      responses:
        '200':
          description: Principal da requisição
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Solicitar redefinição de senha
      description: |
        RN-05 (Tela 01). Resposta **sempre** genérica, exista ou não a conta.
        Gera token de uso único com expiração curta e dispara o e-mail.
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Resposta genérica, independente de a conta existir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Redefinir a senha com token
      description: |
        Consome o token de uso único. Ao concluir, revoga todas as sessões
        ativas do usuário. Token inválido, expirado ou já usado → `422`.
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Senha redefinida e sessões revogadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/signup/studio:
    post:
      tags: [auth]
      summary: Criar conta de estúdio
      description: |
        Cria usuário, organização e membership `owner` em uma única transação
        (decisão `DECISIONS.md` §1.1). Idade mínima 18 anos (§1.4).
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupStudioRequest' }
      responses:
        '201':
          description: Conta, organização e sessão criadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/signup/player:
    post:
      tags: [auth]
      summary: Criar conta de jogador
      description: 'Cria usuário e membership `player`. Idade mínima 18 anos.'
      security: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupPlayerRequest' }
      responses:
        '201':
          description: Conta e sessão criadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/signup/availability:
    get:
      tags: [auth]
      summary: Checar disponibilidade de e-mail
      description: |
        Usado para feedback em formulário. Resposta propositalmente pobre e com
        rate limit agressivo, para não virar enumeração de contas.
      security: []
      x-status: implemented
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Disponibilidade do e-mail
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ------------------------------------------------------------------ M2 orgs
  /orgs/current:
    get:
      tags: [orgs]
      summary: Organização da sessão
      x-status: implemented
      responses:
        '200':
          description: Organização atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [orgs]
      summary: Atualizar dados da organização
      description: 'Papéis: `owner`, `admin`.'
      x-status: todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrgRequest' }
      responses:
        '200':
          description: Organização atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orgs/members:
    get:
      tags: [orgs]
      summary: Listar membros
      description: |
        Tela 20 exige busca e filtro. Hoje implementado sem paginação nem
        filtros — estender.
      x-status: partial
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Busca por nome ou e-mail
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MembershipStatus' }
      responses:
        '200':
          description: Página de membros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs/members/invite:
    post:
      tags: [orgs]
      summary: Convidar membro
      description: |
        Cria membership com status `invited` e dispara e-mail de convite. Não
        cria senha — o convidado define a dele pelo fluxo de redefinição
        (RN-04, Tela 20).
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Convite criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Usuário já é membro da organização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orgs/members/{userId}/role:
    patch:
      tags: [orgs]
      summary: Alterar papel de um membro
      description: |
        RN-02 (Tela 20): ação crítica, exige `confirm: true` explícito.

        RN-03: rebaixar o **último Owner ativo** é recusado com `409`.

        RN-05: gera registro em `audit_log` com autor, data e ação.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: Papel alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Último Owner ativo, ou conflito de edição concorrente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orgs/members/{userId}/status:
    patch:
      tags: [orgs]
      summary: Ativar ou desativar um membro
      description: |
        RN-06 (Tela 20): desativação lógica; não há exclusão física quando há
        histórico de testes associado. Desativar o último Owner ativo → `409`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Último Owner ativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /orgs/members/{userId}/password-reset:
    post:
      tags: [orgs]
      summary: Disparar redefinição de senha para um membro
      description: |
        RN-04 (Tela 20): o administrador **nunca** define nem vê a senha de
        outro usuário; apenas dispara o fluxo de redefinição.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '202':
          description: E-mail de redefinição enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/members/{userId}:
    delete:
      tags: [orgs]
      summary: Remover membro
      description: |
        RN-06: desativação lógica quando há histórico associado. Papel `owner`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Membro removido ou desativado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Último Owner ativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /audit-logs:
    get:
      tags: [orgs]
      summary: Consultar trilha de auditoria
      description: 'Papéis: `owner`, `admin`. Escopado pela organização.'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de registros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------- M3 games
  /games:
    get:
      tags: [games]
      summary: Listar jogos do estúdio
      description: |
        RN-03 (Tela 03): as métricas do card são **agregadas no backend** a
        partir dos testes do jogo. Filtros `q`/`status` e paginação por cursor.
        `sessionsValid`, `playersTotal` e `averageRating` ficam zerados até
        M8/M13 gravarem linhas.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GameStatus' }
      responses:
        '200':
          description: Página de jogos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [games]
      summary: Criar jogo
      description: |
        RN-02 (Tela 04): o jogo é sempre criado dentro da organização da sessão;
        `organizationId` não é aceito no corpo.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGameRequest' }
      responses:
        '201':
          description: Jogo criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Slug já usado nesta organização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /games/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [games]
      summary: Obter jogo
      x-status: implemented
      responses:
        '200':
          description: Jogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [games]
      summary: Atualizar jogo
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGameRequest' }
      responses:
        '200':
          description: Jogo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [games]
      summary: Remover jogo
      description: Exclusão lógica (`deleted_at`).
      x-status: implemented
      responses:
        '204': { description: Jogo removido }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{id}/assets/upload-url:
    post:
      tags: [games]
      summary: Obter URL assinada para upload de imagem
      description: |
        RN-05 (Tela 04): formato, tamanho e falha de envio são validados **no
        backend**. Esta rota valida `contentType` e `sizeBytes` antes de assinar;
        a confirmação em `POST /games/{id}/assets` valida o objeto de fato
        gravado.

        O binário vai direto do cliente para o storage — a API nunca faz proxy.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUploadUrlRequest' }
      responses:
        '201':
          description: URL de upload assinada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrlResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /games/{id}/assets:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [games]
      summary: Confirmar upload e vincular imagem ao jogo
      description: |
        Verifica a existência do objeto no storage antes de gravar a linha. Um
        upload que não chegou não vira asset.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAssetRequest' }
      responses:
        '201':
          description: Asset vinculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameAsset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Objeto ausente no storage, formato ou tamanho inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /games/{id}/assets/{assetId}:
    delete:
      tags: [games]
      summary: Remover imagem do jogo
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Asset removido }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{id}/summary:
    get:
      tags: [games]
      summary: Resumo do jogo para a tela de detalhes
      description: 'Tela 05. Banner, disponibilidade e indicadores agregados.'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resumo do jogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{id}/tests:
    get:
      tags: [games]
      summary: Testes de um jogo
      description: 'Tabela da Tela 05. RN-04: os estados vêm do backend.'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: tab
          in: query
          schema: { type: string, enum: [active, all], default: active }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TestStatus' }
      responses:
        '200':
          description: Página de testes do jogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{id}/achievements:
    get:
      tags: [games]
      summary: Conquistas configuradas do jogo
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Conquistas do jogo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Achievement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{id}/specs:
    get:
      tags: [games]
      summary: Especificações técnicas do jogo
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Especificações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSpecs' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- M4 test-models
  /test-models:
    get:
      tags: [test-models]
      summary: Catálogo de modelos de teste
      description: |
        RN-03 (Tela 06): requisitos técnicos vêm da configuração do backend; a
        UI nunca os define.

        RN-04: `requiresTelemetry` indica dependência do Orbit Plug-in. Nesta
        fase, `free_exploration_telemetry` retorna `available: false` com
        `unavailableReason`, porque o plug-in está deferido.
      x-status: todo
      responses:
        '200':
          description: Modelos disponíveis
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TestModel' }

  /test-models/{key}:
    get:
      tags: [test-models]
      summary: Detalhe de um modelo de teste
      x-status: todo
      parameters:
        - name: key
          in: path
