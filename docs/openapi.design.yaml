          schema: { $ref: '#/components/schemas/TestModelKey' }
      responses:
        '200':
          description: Modelo de teste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestModel' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- M5 tests
  /games/{gameId}/tests:
    post:
      tags: [tests]
      summary: Criar rascunho de teste
      description: |
        RN-01 (Tela 05): o teste nasce associado ao jogo atual. O wizard é um
        rascunho persistido (`status: draft`) para que voltar entre etapas não
        perca dados.
      x-status: todo
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTestRequest' }
      responses:
        '201':
          description: Rascunho criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}:
    get:
      tags: [tests]
      summary: Obter teste
      description: |
        Inclui `currentStep` e `pendingValidations` — é o backend quem diz em
        que etapa o wizard está e o que falta para publicar.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Teste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/model:
    patch:
      tags: [tests]
      summary: 'Etapa 1 — selecionar modelo de teste'
      description: |
        RN-01/02 (Tela 06): seleção única e obrigatória. Modelo indisponível
        (`available: false`) é recusado com `422`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testModelKey]
              properties:
                testModelKey: { $ref: '#/components/schemas/TestModelKey' }
      responses:
        '200':
          description: Modelo definido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}/form:
    put:
      tags: [tests]
      summary: 'Etapa 2 — definir o formulário do teste'
      description: |
        Substitui o conjunto inteiro de perguntas em uma transação, o que torna
        a reordenação atômica.

        RN-01 (Tela 07): cada pergunta exige tipo e enunciado.

        RN-02: tipos com opções exigem a quantidade mínima de opções.

        RN-03: a ordem é persistida exatamente como enviada — `position` é
        autoridade, não a ordem do array.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutFormRequest' }
      responses:
        '200':
          description: Formulário salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestForm' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}/form/preview:
    get:
      tags: [tests]
      summary: Pré-visualizar o formulário
      description: Devolve o formulário como o jogador vai recebê-lo.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Formulário renderizável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestForm' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/build/upload-url:
    post:
      tags: [tests]
      summary: 'Etapa 3 — obter URL assinada para upload da build'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildUploadUrlRequest' }
      responses:
        '201':
          description: URL de upload assinada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrlResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}/build:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tests]
      summary: Confirmar upload da build e disparar validação
      description: |
        RN-01 (Tela 08): só avança com upload concluído e validado. Esta rota
        enfileira `build.validate` e devolve a build em `status: processing`.
      x-status: todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmBuildRequest' }
      responses:
        '202':
          description: Build recebida, validação enfileirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Build' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [tests]
      summary: Estado da build do teste
      description: |
        RN-05 (Tela 08): falha preserva o formulário e permite nova tentativa —
        `failureReason` diz o que corrigir.

        `validationSteps` é uma **lista de etapas**, não um booleano, para que a
        leitura do manifesto do Orbit Plug-in entre depois como mais uma etapa.
      x-status: todo
      responses:
        '200':
          description: Build e estado da validação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Build' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tests]
      summary: Remover a build para substituí-la
      x-status: todo
      responses:
        '204': { description: Build removida }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Teste já publicado — build não pode ser trocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /tests/{id}/audience:
    patch:
      tags: [tests]
      summary: 'Etapa 4 — público, quantidade e duração'
      description: |
        RN-01 (Tela 09): precisa existir público elegível. O backend valida que
        a combinação retorna estimativa maior que zero e devolve
        `estimatedReach`.

        RN-02: `ageMin` menor ou igual a `ageMax`, ambos dentro dos limites do
        produto (18+).

        Preço e impulsionamento estão deferidos; `quantity` e `durationDays`
        seguem sendo campos próprios porque a precificação vai consumi-los.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AudienceRequest' }
      responses:
        '200':
          description: Público definido, com estimativa de alcance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}/publish:
    post:
      tags: [tests]
      summary: 'Etapa 5 — publicar o teste'
      description: |
        RN-02 (Tela 10): recarregar **não pode criar um segundo teste**.
        `Idempotency-Key` obrigatório; repetir a chave devolve o mesmo teste.
        Esta regra não depende de cobrança.

        RN-05 (Tela 09): recusa com `422` listando `pendingValidations` se
        alguma etapa anterior estiver incompleta.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Teste publicado (ou já publicado, em repetição da chave)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Etapas pendentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /tests/{id}/status:
    patch:
      tags: [tests]
      summary: Pausar ou encerrar um teste
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paused, active, closed] }
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transição de status inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # --------------------------------------------------------------- M6 builds
  /builds/{id}:
    get:
      tags: [builds]
      summary: Obter build
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Build
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Build' }
        '404': { $ref: '#/components/responses/NotFound' }

  /builds/{id}/compatibility:
    get:
      tags: [builds]
      summary: Checar compatibilidade do dispositivo
      description: |
        RN-03 (Tela 14) e RN-05 (Tela 15): compatibilidade é verificada **antes**
        do download. Incompatível devolve `compatible: false` com motivos
        legíveis, não um erro.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Platform' }
        - name: os
          in: query
          schema: { type: string, example: 'Windows 11' }
        - name: arch
          in: query
          schema: { type: string, example: x64 }
      responses:
        '200':
          description: Resultado da checagem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityReport' }
        '404': { $ref: '#/components/responses/NotFound' }

  /builds/{id}/download-url:
    get:
      tags: [builds]
      summary: Obter URL assinada para baixar a build
      description: |
        RN-03 (Tela 16): só é liberada com participação ativa **e**
        compatibilidade confirmada.

        RN-04: a URL suporta `Range`, para permitir retomar download
        interrompido.

        RN-05: o cliente informa `localVersion`; se coincidir com a atual, a
        resposta indica que não é preciso baixar de novo.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: localVersion
          in: query
          description: Versão já presente no dispositivo, se houver
          schema: { type: string }
      responses:
        '200':
          description: URL de download assinada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrlResponse' }
        '403':
          description: Sem participação ativa neste teste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Dispositivo incompatível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ----------------------------------------------------------- M7 player feed
  /player/home:
    get:
      tags: [player-feed]
      summary: Home do jogador
      description: |
        RN-01 (Tela 13): nível, XP, qualidade de feedback e conquistas vêm
        prontos do backend — a UI não recalcula.

        RN-02: `currentParticipation` traz o ponto de retomada permitido pelo
        modelo do teste.

        O bloco de carteira está deferido e não aparece nesta versão.
      x-status: todo
      responses:
        '200':
          description: Home do jogador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerHome' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /player/feed:
    get:
      tags: [player-feed]
      summary: Feed rankeado de testes disponíveis
      description: |
        Feed no estilo Steam, **ordenado pelo backend**. O cliente nunca
        reordena.

        ### Paginação — exceção à convenção da API

        O cursor padrão (`UUIDv7`) assume ordem cronológica estável e **não
        serve aqui**: um ranking muda entre requisições e produziria itens
        repetidos e itens pulados. Este endpoint usa **ranking congelado por
        sessão de navegação**:

        1. A primeira chamada (sem `cursor`) calcula o ranking, persiste um
           snapshot e devolve `rankingSeed` junto do `nextCursor`.
        2. As chamadas seguintes enviam o `cursor`, que carrega o seed e a
           posição — a ordem permanece consistente durante a rolagem.
        3. O snapshot tem TTL curto; expirado, o cliente recomeça do topo com um
           seed novo.

        ### Slots

        `items` vem como lista de slots. Nesta fase todos têm
        `type: organic`, mas a estrutura de slot já existe porque é onde o
        impulsionamento (deferido) se encaixa sem redesenhar o módulo.

        Elegibilidade segue as regras das Telas 14 e 15: item incompatível ou
        indisponível aparece com `disabled: true` e `disabledReason`, em vez de
        sumir sem explicação.
      x-status: todo
      parameters:
        - name: section
          in: query
          description: Trilho do feed a carregar
          schema: { type: string, enum: [for_you, new, ending_soon, popular], default: for_you }
        - name: cursor
          in: query
          description: Cursor de ranking congelado, devolvido pela chamada anterior
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
        - name: genre
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página do feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Cursor de ranking expirado — recomeçar do topo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /player/feed/filters:
    get:
      tags: [player-feed]
      summary: Facetas disponíveis para filtrar o feed
      description: Devolve apenas facetas com resultado para este jogador.
      x-status: todo
      responses:
        '200':
          description: Facetas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedFilters' }

  /player/games/{gameId}:
    get:
      tags: [player-feed]
      summary: Detalhes de um jogo para o jogador
      description: 'Tela 15. Banner, disponibilidade, jogadores e testes abertos.'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Jogo na visão do jogador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerGame' }
        '404': { $ref: '#/components/responses/NotFound' }

  /player/games/{gameId}/tests:
    get:
      tags: [player-feed]
      summary: Testes de um jogo disponíveis para o jogador
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de testes elegíveis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerTestList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /player/tests/{testId}:
    get:
      tags: [player-feed]
      summary: Detalhe de um teste para o jogador
      description: |
        RN-01 (Tela 15): `cta` é **calculado no backend** —
        `start`, `continue`, `completed`, `in_review`, `downloading` ou
        `unavailable`. A UI apenas renderiza o que veio.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Teste na visão do jogador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerTest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /player/participations:
    get:
      tags: [player-feed]
      summary: Meus testes
      description: |
        Rota própria, e **não** `/player/tests/mine`, de propósito: o segmento
        literal `mine` colidiria com o parâmetro de `/player/tests/{testId}`. Em
        roteadores que casam o segmento dinâmico primeiro, `mine` cairia no
        `{testId}` e falharia na validação de UUID. Separar a rota remove a
        ambiguidade em vez de depender da ordem de declaração.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ParticipationStatus' }
      responses:
        '200':
          description: Página de participações do jogador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipationList' }

  # ------------------------------------------------- M8 participations/sessions
  /player/tests/{testId}/participations:
    post:
      tags: [participations]
      summary: Entrar em um teste
      description: |
        Reserva a vaga. Valida elegibilidade, vagas restantes, prazo e
        compatibilidade **no servidor** — a checagem feita para montar o feed
        não é suficiente, porque o estado pode ter mudado desde então.

        RN-02 (Tela 14): não é permitido iniciar duas participações simultâneas
        no mesmo teste. Repetição com a mesma `Idempotency-Key` devolve a
        participação existente; sem a chave, um segundo pedido responde `409`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Participação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Já participa, vagas esgotadas, teste expirado ou dispositivo incompatível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /participations/{id}:
    get:
      tags: [participations]
      summary: Obter participação
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Participação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /participations/{id}/consents:
    post:
      tags: [participations]
      summary: Registrar consentimentos de gravação
      description: |
        RN-02 (Tela 16) e RN-01 (Tela 17): a gravação só pode começar depois que
        o consentimento está **registrado no servidor**. Consentimento é dado
        legal, não estado de UI — guarda-se quem consentiu, com o quê, quando e
        de qual IP.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '201':
          description: Consentimentos registrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Consentimento obrigatório do modelo foi recusado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /participations/{id}/tutorial:
    get:
      tags: [participations]
      summary: Tutorial do modelo de teste
      description: |
        RN-01 (Tela 16): o tutorial corresponde ao **modelo do teste**, não ao
        jogo. Inclui quais permissões serão pedidas e quais são obrigatórias.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Passos do tutorial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tutorial' }
        '404': { $ref: '#/components/responses/NotFound' }

  /participations/{id}/sessions:
    post:
      tags: [participations]
      summary: Iniciar sessão de teste
      description: |
        RN-03 (Tela 16): a sessão só inicia após o download e a **validação** da
        build, e com os consentimentos obrigatórios já registrados.

        A emissão de token do Orbit Plug-in acontece aqui quando a telemetria
        voltar ao escopo (deferido).
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSessionRequest' }
      responses:
        '201':
          description: Sessão iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStarted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Build não validada, consentimento ausente ou sessão já ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /sessions/{id}/devices:
    patch:
      tags: [participations]
      summary: Registrar mudança de microfone ou webcam
      description: |
        RN-04 (Tela 17): toda alteração é registrada **com o timestamp da
        sessão** (`tMs`), para poder ser cruzada com o vídeo depois.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceEventRequest' }
      responses:
        '204': { description: Evento registrado }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sessão já encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /sessions/{id}/heartbeat:
    post:
      tags: [participations]
      summary: Sinal de vida da sessão
      description: |
        Permite detectar conexão instável e sessão abandonada. Sem heartbeat
        dentro da janela configurada, a sessão é encerrada por timeout e entra
        na validação como incompleta.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '204': { description: Heartbeat aceito }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/finish:
    post:
      tags: [participations]
      summary: Finalizar a sessão
      description: |
        RN-03 (Tela 17): a confirmação do usuário acontece na UI; aqui o corpo
        traz `confirmed: true` para que um clique acidental não encerre a
        sessão.

        Enfileira `session.validate`. A participação passa a `in_review`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishSessionRequest' }
      responses:
        '200':
          description: Sessão encerrada e enviada para validação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sessão já encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /sessions/{id}/summary:
    get:
      tags: [participations]
      summary: Resumo da sessão para o jogador
      description: |
        Tela 18. Traz o resumo, a prévia da gravação e o formulário a responder.

        RN-05 (Tela 18): os dados brutos da sessão são somente leitura para o
        jogador.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resumo da sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/form-response:
    post:
      tags: [participations]
      summary: Enviar a avaliação da sessão
      description: |
        RN-01 (Tela 18): perguntas obrigatórias não respondidas bloqueiam o
        envio → `422` com erro por campo (`fieldErrors`, chaveado por
        `questionId`).

        RN-02: as respostas ficam vinculadas à sessão e ao jogador autenticado.

        RN-03: envio duplicado não gera segunda avaliação — com a mesma
        `Idempotency-Key`, devolve a resposta original; sem ela, `409`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormResponseRequest' }
      responses:
        '201':
          description: Avaliação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Avaliação já enviada para esta sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /participations/{id}/result:
    get:
      tags: [participations]
      summary: Resultado da participação
      description: |
        Tela 19. RN-01/02: XP, nota e conquistas só saem **depois da validação
        da sessão**; enquanto isso, `status: in_review` e os valores vêm nulos.

        RN-03: recarregar não duplica XP nem conquista — a transição é única e
        transacional. Esta rota é leitura pura.

        RN-04: o crédito financeiro está deferido. `rewardCents` é informativo e
        `rewardStatus` permanece `pending`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado ou estado de análise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipationResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- M9 media
  /sessions/{id}/recordings/upload-url:
    post:
      tags: [media]
      summary: Obter URL assinada para enviar a gravação
      description: |
        Suporta envio em partes, para gravações longas e conexões instáveis.
        Chamar uma vez por parte, informando `partNumber`.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingUploadUrlRequest' }
      responses:
        '201':
          description: URL de upload assinada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrlResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/recordings/complete:
    post:
      tags: [media]
      summary: Confirmar a gravação enviada
      description: |
        Fecha o envio em partes e enfileira `media.transcode` e
        `media.extract-audio`. O áudio extraído fica pronto para o ASR
        (deferido) sem reprocessar o vídeo depois.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingCompleteRequest' }
      responses:
        '202':
          description: Gravação recebida, processamento enfileirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions/{id}/recordings/{recordingId}/playback-url:
    get:
      tags: [media]
      summary: Obter URL assinada para assistir à gravação
      description: |
        RN-03 (Tela 12): gravação ausente ou ainda processando **não é erro** —
        devolve `status` correspondente e `url: null`, para que o resto da tela
        continue funcionando.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: recordingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: URL de reprodução ou estado da mídia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackUrlResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- M10 reports
  /tests/{id}/report:
    get:
      tags: [reports]
      summary: Relatório consolidado do teste
      description: |
        RN-01 (Tela 11): as métricas refletem **somente sessões válidas**.

        RN-02: bloco ainda processando devolve `status: processing` em vez de
        valor provisório.

        O relatório é montado como **blocos independentes**, cada um com o seu
        `status`. Assim um bloco em erro não derruba a página, e os blocos de
        telemetria e de insights de IA (deferidos) entram depois sem quebrar o
        contrato.

        `stage` reflete a RN-02 da Tela 05: `partial` enquanto o teste corre,
        `final` só com o processamento concluído.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Relatório em blocos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/report/evolution:
    get:
      tags: [reports]
      summary: Série temporal de sessões e notas
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week], default: day }
      responses:
        '200':
          description: Bloco de evolução
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportBlock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/report/ratings:
    get:
      tags: [reports]
      summary: Distribuição das avaliações do formulário
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Bloco de avaliações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportBlock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/report/testers:
    get:
      tags: [reports]
      summary: Distribuição de testadores e arquétipos
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Bloco de testadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportBlock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{id}/sessions:
    get:
      tags: [reports]
      summary: Sessões do teste
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          schema: { type: string, enum: [recent, duration, rating], default: recent }
        - name: validity
          in: query
          description: Filtrar por validade da sessão
          schema: { type: string, enum: [valid, invalid, all], default: valid }
      responses:
        '200':
          description: Página de sessões
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}:
    get:
      tags: [reports]
      summary: Detalhe de uma sessão
      description: |
        Tela 12. RN-01: a sessão precisa pertencer ao teste selecionado **e** à
        organização da sessão; caso contrário `404`.

        RN-02: vídeo e eventos de dispositivo usam a mesma base temporal
        (`tMs`). Transcrição, telemetria e insights vão se ancorar nela quando
        entrarem.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sessão detalhada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/rate:
    post:
      tags: [reports]
      summary: Avaliar a sessão do testador
      description: |
        Alimenta a "qualidade de feedback" do jogador (M12). Uma sessão pode ser
        marcada como inválida aqui, e isso a remove das métricas do relatório
        (RN-01, Tela 11).
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateSessionRequest' }
      responses:
        '200':
          description: Avaliação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRating' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tests/{id}/report/export:
    get:
      tags: [reports]
      summary: Exportar o relatório
      description: |
        Exportação grande roda em job. Enquanto não fica pronta, responde `202`
        com o id do job; concluída, responde `200` com a URL assinada.
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, pdf] }
      responses:
        '200':
          description: Arquivo pronto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '202':
          description: Exportação enfileirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- M11 dashboard
  /studio/dashboard:
    get:
      tags: [dashboard]
      summary: Dashboard do estúdio
      description: |
        Tela 02. RN-02: os KPIs são **calculados e consolidados no backend**; a
        UI não recalcula valor nenhum.

        RN-01: tudo filtrado pela organização e pelo escopo de permissão do
        usuário.

        Servido de cache (Redis) com invalidação por evento de domínio.
      x-status: todo
      responses:
        '200':
          description: Dashboard consolidado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /studio/benchmark:
    get:
      tags: [dashboard]
      summary: Benchmark de mercado
      description: |
        Bloco de benchmark da Tela 02. **A fonte de dados ainda não foi
        definida** (pendência 7 da especificação) — o contrato está aqui para
        não travar a tela, mas a implementação depende dessa decisão.
      x-status: todo
      responses:
        '200':
          description: Benchmark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportBlock' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------- M12 gamification
  /player/progress:
    get:
      tags: [gamification]
      summary: Progresso do jogador
      x-status: todo
      responses:
        '200':
          description: Nível, XP e qualidade de feedback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProgress' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /player/achievements:
    get:
      tags: [gamification]
      summary: Conquistas do jogador
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de conquistas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerAchievementList' }

  /player/missions:
    get:
      tags: [gamification]
      summary: Missões do jogador
      x-status: todo
      responses:
        '200':
          description: Missões ativas e progresso
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerMission' }

  /rankings:
    get:
      tags: [gamification]
      summary: Ranking de jogadores
      description: |
        Escopo e periodicidade ainda em aberto (pendência 5 da especificação).
        Servido de snapshot materializado, nunca calculado na requisição.
      x-status: todo
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [global, game], default: global }
        - name: gameId
          in: query
          description: Obrigatório quando `scope=game`
          schema: { type: string, format: uuid }
        - name: period
          in: query
          schema: { type: string, enum: [week, month, all], default: month }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página do ranking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankingList' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------- M13 community
  /games/{gameId}/community/posts:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [community]
      summary: Publicações da comunidade do jogo
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de publicações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPostList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [community]
      summary: Publicar na comunidade do jogo
      description: 'RN-04 (Tela 15): sujeito a moderação e vínculo com o jogo.'
      x-status: todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunityPostRequest' }
      responses:
        '201':
          description: Publicação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPost' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /community/posts/{id}/report:
    post:
      tags: [community]
      summary: Denunciar uma publicação
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, abuse, spoiler, other] }
                details: { type: string, maxLength: 1000 }
      responses:
        '202': { description: Denúncia registrada }
        '404': { $ref: '#/components/responses/NotFound' }

  /community/posts/{id}/moderate:
    patch:
      tags: [community]
      summary: Moderar uma publicação
      description: 'Papéis do estúdio dono do jogo. Gera registro de auditoria.'
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [hide, restore, pin, unpin] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Publicação moderada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPost' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/reviews:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [community]
      summary: Avaliações do jogo
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de avaliações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [community]
      summary: Avaliar o jogo
      description: |
        Só quem concluiu ao menos uma sessão válida do jogo pode avaliar, e uma
        vez por jogador.
      x-status: todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403':
          description: Sem sessão válida concluída neste jogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Jogador já avaliou este jogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ------------------------------------------------------- M14 notifications
  /notifications:
    get:
      tags: [notifications]
      summary: Notificações do usuário
      description: |
        A existência do componente in-app ainda precisa ser confirmada no Figma
        (pendência 8 da especificação).
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Página de notificações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }

  /notifications/{id}/read:
    patch:
      tags: [notifications]
      summary: Marcar notificação como lida
      x-status: todo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Marcada como lida }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de curta duração devolvido por `/auth/login`.
    cookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: 'Refresh token httpOnly, rotacionado a cada `/auth/refresh`.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TestId:
      name: testId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido como `nextCursor` na página anterior.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave única por tentativa, gerada pelo cliente (UUID). Repetir a chave
        **reproduz a resposta original** em vez de executar a operação de novo.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Papel sem permissão para esta ação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        Recurso inexistente — ou pertencente a outra organização. As duas
        situações respondem igual, de propósito, para não vazar existência.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Dados inválidos, com erro por campo em `fieldErrors`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Limite de requisições excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ---- transversais ----
    ErrorEnvelope:
      type: object
      description: |
        Envelope único de erro da API. Serializado exclusivamente pelo
        `HttpExceptionFilter` — nenhum controller monta erro à mão.
      required: [statusCode, code, message, requestId]
      properties:
        statusCode: { type: integer, example: 422 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, example: Dados inválidos }
        fieldErrors:
          type: object
          description: Mensagem por campo, presente em falhas de validação.
          additionalProperties: { type: string }
          example: { title: Título obrigatório }
        requestId:
          type: string
          description: Correlaciona a resposta com os logs estruturados.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - TOO_MANY_REQUESTS
        - UNPROCESSABLE_ENTITY
        - INTERNAL_ERROR

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ProcessingStatus:
      type: string
      description: |
        Estado de um recurso que depende de job assíncrono. Enquanto
        `processing`, a UI mostra o estado — nunca um valor provisório
        disfarçado de definitivo.
      enum: [processing, ready, failed, unavailable]

    Role:
      type: string
      enum: [owner, admin, studio, player]

    MembershipStatus:
      type: string
      enum: [active, invited, disabled]

    GameStatus:
      type: string
      enum: [draft, active, archived]

    TestStatus:
      type: string
      enum: [draft, active, paused, closed, expired]

    ParticipationStatus:
      type: string
      description: |
        Máquina de estados da participação, alinhada às telas do fluxo do
        jogador: `tutorial` (Tela 16), `playing` (Tela 17), `form_pending`
        (Tela 18) e `in_review` (Tela 19).
      enum:
        - reserved
        - tutorial
        - downloading
        - ready
        - playing
        - form_pending
        - in_review
        - completed
        - rejected
        - abandoned

    Platform:
      type: string
      enum: [windows, macos, linux, android, ios, web]

    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          required: [database, redis, storage]
          properties:
            database: { $ref: '#/components/schemas/CheckStatus' }
            redis: { $ref: '#/components/schemas/CheckStatus' }
            storage: { $ref: '#/components/schemas/CheckStatus' }
            queue: { $ref: '#/components/schemas/CheckStatus' }

    CheckStatus:
      type: string
      enum: [up, down]

    UploadUrlResponse:
      type: object
      description: |
        URL assinada para o cliente enviar bytes **direto ao storage**. A API
        nunca faz proxy de binário.
      required: [uploadUrl, storageKey, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri }
        storageKey: { type: string }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer }

    # ---- auth ----
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: E-mail ou ID de acesso.
        password: { type: string, format: password, minLength: 8 }
        rememberMe:
          type: boolean
          default: false
          description: 'RN-04: altera apenas o TTL do refresh token.'

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos até expirar. }
        user: { $ref: '#/components/schemas/AuthUser' }

    AuthUser:
      type: object
      required: [userId, email, displayName, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        organizationId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password, minLength: 8 }

    SignupStudioRequest:
      type: object
      required: [displayName, email, password, birthdate, organizationName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        birthdate:
          type: string
          format: date
          description: 'Idade mínima 18 anos (DECISIONS.md §1.4).'
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        acceptedTerms: { type: boolean }

    SignupPlayerRequest:
      type: object
      required: [displayName, email, password, birthdate]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        birthdate: { type: string, format: date }
        acceptedTerms: { type: boolean }

    # ---- orgs ----
    Org:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    UpdateOrgRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Member:
      type: object
      required: [userId, email, displayName, role, status]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: Usado para detectar edição concorrente.

    MemberList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        nextCursor: { type: string, nullable: true }

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    ChangeRoleRequest:
      type: object
      required: [role, confirm]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        confirm:
          type: boolean
          description: 'RN-02: ação crítica, exige confirmação explícita.'
          enum: [true]

    ChangeStatusRequest:
      type: object
      required: [status, confirm]
      properties:
        status: { $ref: '#/components/schemas/MembershipStatus' }
        confirm: { type: boolean, enum: [true] }

    AuditLogEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string, example: member.role.changed }
        entityType: { type: string, nullable: true }
        entityId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    AuditLogList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEntry' }
        nextCursor: { type: string, nullable: true }

    # ---- games ----
    Game:
      type: object
      required: [id, organizationId, title, slug, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        genre: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/GameStatus' }
        coverUrl: { type: string, format: uri, nullable: true }
        bannerUrl: { type: string, format: uri, nullable: true }
        metrics: { $ref: '#/components/schemas/GameMetrics' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GameMetrics:
      type: object
      description: |
        RN-03 (Tela 03): agregados a partir dos testes do jogo, calculados no
        backend.
      properties:
        testsTotal: { type: integer }
        testsActive: { type: integer }
        sessionsValid: { type: integer }
        playersTotal: { type: integer }
        averageRating: { type: number, format: float, nullable: true }

    GameList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Game' }
        nextCursor: { type: string, nullable: true }

    CreateGameRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          description: Derivado do título quando omitido.
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 5000 }
        genre: { type: string, maxLength: 100 }
        platform: { type: string, maxLength: 100 }
        status: { $ref: '#/components/schemas/GameStatus' }

    UpdateGameRequest:
      type: object
      description: Todos os campos opcionais.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 5000 }
        genre: { type: string, maxLength: 100 }
        platform: { type: string, maxLength: 100 }
        status: { $ref: '#/components/schemas/GameStatus' }

    AssetKind:
      type: string
      enum: [cover, banner, screenshot]

    AssetUploadUrlRequest:
      type: object
      required: [kind, contentType, sizeBytes, fileName]
      properties:
        kind: { $ref: '#/components/schemas/AssetKind' }
        contentType: { type: string, enum: ['image/png', 'image/jpeg', 'image/webp'] }
        sizeBytes: { type: integer, minimum: 1 }
        fileName: { type: string }

    ConfirmAssetRequest:
      type: object
      required: [kind, storageKey]
      properties:
        kind: { $ref: '#/components/schemas/AssetKind' }
        storageKey: { type: string }

    GameAsset:
      type: object
      required: [id, kind, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AssetKind' }
        url: { type: string, format: uri }
        contentType: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    GameSummary:
      type: object
      description: 'Tela 05 — cabeçalho e indicadores do jogo.'
      required: [game, availability, metrics]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        availability:
          type: string
          enum: [available, unavailable]
        metrics: { $ref: '#/components/schemas/GameMetrics' }
        canEdit:
          type: boolean
          description: 'RN-03 (Tela 05): reflete a permissão real do usuário.'

    GameSpecs:
      type: object
      properties:
        minimumRequirements: { type: object, additionalProperties: { type: string } }
        recommendedRequirements: { type: object, additionalProperties: { type: string } }
        supportedPlatforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        languages:
          type: array
          items: { type: string }

    # ---- test models ----
    TestModelKey:
      type: string
      enum:
        - free_exploration_telemetry
        - free_exploration
        - ab_test
        - ab_test_images

    TestModel:
      type: object
      required: [key, name, description, requiresTelemetry, available]
      properties:
        key: { $ref: '#/components/schemas/TestModelKey' }
        name: { type: string }
        description: { type: string }
        deliverables:
          type: array
          items: { type: string }
        technicalRequirements:
          type: array
          items: { type: string }
        requiresTelemetry:
          type: boolean
          description: |
            'RN-04 (Tela 06): quando `true`, a Etapa 3 exige o Orbit Plug-in
            detectado e validado. O plug-in está deferido nesta fase, então
            modelos com esta flag vêm `available: false`.'
        available: { type: boolean }
        unavailableReason: { type: string, nullable: true }

    # ---- tests / wizard ----
    Test:
      type: object
      required: [id, gameId, organizationId, status, currentStep]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TestStatus' }
        testModelKey: { $ref: '#/components/schemas/TestModelKey' }
        currentStep:
          type: integer
          minimum: 1
          maximum: 5
          description: Etapa em que o wizard está, decidida pelo backend.
        pendingValidations:
          type: array
          description: O que ainda falta para publicar. Vazio significa pronto.
          items: { $ref: '#/components/schemas/PendingValidation' }
        audience: { $ref: '#/components/schemas/Audience' }
        build: { $ref: '#/components/schemas/Build' }
        spotsTotal: { type: integer, nullable: true }
        spotsTaken: { type: integer, nullable: true }
        rewardCents:
          type: integer
          nullable: true
          description: Recompensa por sessão. Informativo nesta fase.
        expiresAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PendingValidation:
      type: object
      required: [step, code, message]
      properties:
        step: { type: integer }
        code: { type: string, example: BUILD_NOT_VALIDATED }
        message: { type: string }

    TestList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Test' }
        nextCursor: { type: string, nullable: true }

    CreateTestRequest:
      type: object
      required: [testModelKey]
      properties:
        testModelKey: { $ref: '#/components/schemas/TestModelKey' }
        title: { type: string, maxLength: 200 }

    QuestionType:
      type: string
      enum: [short_text, long_text, single_choice, multiple_choice, scale, rating, boolean]

    FormQuestion:
      type: object
      required: [id, type, prompt, required, position]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1 }
        helpText: { type: string, nullable: true }
        required: { type: boolean }
        position:
          type: integer
          description: 'RN-03 (Tela 07): a ordem persistida é esta, não a do array.'
        options:
          type: array
          description: |
            'RN-02: obrigatório para `single_choice` e `multiple_choice`, com no
            mínimo duas opções.'
          items: { $ref: '#/components/schemas/FormOption' }
        scaleMin: { type: integer, nullable: true }
        scaleMax: { type: integer, nullable: true }

    FormOption:
      type: object
      required: [label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1 }
        position: { type: integer }

    FormQuestionInput:
      type: object
      required: [type, prompt, required, position]
      properties:
        id:
          type: string
          format: uuid
          description: Presente ao editar uma pergunta existente; ausente ao criar.
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1 }
        helpText: { type: string }
        required: { type: boolean }
        position: { type: integer, minimum: 0 }
        options:
          type: array
          items:
            type: object
            required: [label, position]
            properties:
              id: { type: string, format: uuid }
              label: { type: string, minLength: 1 }
              position: { type: integer, minimum: 0 }
        scaleMin: { type: integer }
        scaleMax: { type: integer }

    PutFormRequest:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          description: |
            Conjunto completo de perguntas. Substitui o anterior em uma
            transação, o que torna a reordenação atômica. Pergunta ausente é
            removida.
          items: { $ref: '#/components/schemas/FormQuestionInput' }

    TestForm:
      type: object
      required: [testId, questions]
      properties:
        testId: { type: string, format: uuid }
        questions:
          type: array
          items: { $ref: '#/components/schemas/FormQuestion' }

    BuildUploadUrlRequest:
      type: object
      required: [fileName, contentType, sizeBytes, platform]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        platform: { $ref: '#/components/schemas/Platform' }
        version: { type: string }

    ConfirmBuildRequest:
      type: object
      required: [storageKey, platform, version]
      properties:
        storageKey: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        version: { type: string }
        checksum:
          type: string
          description: SHA-256 calculado pelo cliente, conferido na validação.

    Build:
      type: object
      required: [id, status, validationSteps]
      properties:
        id: { type: string, format: uuid }
        testId: { type: string, format: uuid }
        status:
          type: string
          enum: [uploading, processing, validated, failed]
        platform: { $ref: '#/components/schemas/Platform' }
        version: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        checksum: { type: string, nullable: true }
        validationSteps:
          type: array
          description: |
            Lista de etapas, **não** um booleano. A leitura do manifesto do
            Orbit Plug-in entra aqui como mais uma etapa quando voltar ao
            escopo, sem alterar o formato.
          items: { $ref: '#/components/schemas/ValidationStep' }
        failureReason:
          type: string
          nullable: true
          description: 'RN-05 (Tela 08): diz o que corrigir para tentar de novo.'
        createdAt: { type: string, format: date-time }

    ValidationStep:
      type: object
      required: [key, status]
      properties:
        key:
          type: string
          enum: [checksum, malware_scan, metadata, platform_support]
        status: { type: string, enum: [pending, running, passed, failed, skipped] }
        message: { type: string, nullable: true }

    Audience:
      type: object
      properties:
        locations:
          type: array
          items: { type: string, description: Código de país ou região. }
        archetypes:
          type: array
          items: { type: string }
        ageMin: { type: integer, minimum: 18 }
        ageMax: { type: integer, maximum: 120 }
        quantity: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1 }
        deviceRequirements:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        keepActive: { type: boolean }
        estimatedReach:
          type: integer
          description: |
            'RN-01 (Tela 09): calculado no backend. Zero impede a publicação.'

    AudienceRequest:
      type: object
      required: [ageMin, ageMax, quantity, durationDays]
      properties:
        locations:
          type: array
          items: { type: string }
        archetypes:
          type: array
          items: { type: string }
        ageMin: { type: integer, minimum: 18 }
        ageMax: { type: integer, maximum: 120 }
        quantity: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1 }
        deviceRequirements:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        keepActive: { type: boolean, default: false }

    CompatibilityReport:
      type: object
      required: [compatible, reasons]
      properties:
        compatible: { type: boolean }
        reasons:
          type: array
          description: Motivos legíveis quando incompatível. Vazio quando compatível.
          items: { type: string }
        supportedPlatforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }

    DownloadUrlResponse:
      type: object
      required: [needsDownload, version]
      properties:
        needsDownload:
          type: boolean
          description: |
            'RN-05 (Tela 16): `false` quando `localVersion` já corresponde à
            versão atual — nesse caso `downloadUrl` vem nulo.'
        downloadUrl: { type: string, format: uri, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        version: { type: string }
        checksum: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        supportsRange:
          type: boolean
          description: 'RN-04 (Tela 16): permite retomar download interrompido.'

    # ---- player feed ----
    FeedPage:
      type: object
      required: [items, nextCursor, rankingSeed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedSlot' }
        nextCursor:
          type: string
          nullable: true
          description: Carrega o seed e a posição do ranking congelado.
        rankingSeed:
          type: string
          description: Identifica o snapshot de ranking desta navegação.
        expiresAt:
          type: string
          format: date-time
          description: Expirado o snapshot, o cliente recomeça do topo.

    FeedSlot:
      type: object
      description: |
        Unidade de composição do feed. Nesta fase todo slot é `organic`; o tipo
        `promoted` existe no contrato porque é onde o impulsionamento (deferido)
        se encaixa sem redesenhar o módulo.
      required: [type, position, item]
      properties:
        type: { type: string, enum: [organic, promoted] }
        position: { type: integer }
        item: { $ref: '#/components/schemas/FeedItem' }

    FeedItem:
      type: object
      required: [testId, gameId, title, cta, disabled]
      properties:
        testId: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        title: { type: string }
        genre: { type: string, nullable: true }
        coverUrl: { type: string, format: uri, nullable: true }
        rewardCents: { type: integer, nullable: true }
        durationMinutes: { type: integer, nullable: true }
        spotsLeft: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        platforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        cta: { $ref: '#/components/schemas/TestCta' }
        disabled:
          type: boolean
          description: |
            'RN-03 (Tela 14): incompatível ou indisponível aparece desabilitado
            com motivo, em vez de sumir sem explicação.'
        disabledReason: { type: string, nullable: true }
        promoted:
          type: boolean
          default: false
          description: |
            Item pago. Sempre `false` nesta fase. Quando o impulsionamento
            voltar, a UI **precisa** rotular o item — publicidade não
            identificada é questão regulatória.

    TestCta:
      type: string
      description: 'RN-01 (Tela 15): calculado no backend, nunca inferido na UI.'
      enum: [start, continue, completed, in_review, downloading, unavailable]

    FeedFilters:
      type: object
      properties:
        platforms:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        genres:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }

    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }

    PlayerHome:
      type: object
      required: [progress, highlights]
      properties:
        progress: { $ref: '#/components/schemas/PlayerProgress' }
        currentParticipation:
          allOf:
            - $ref: '#/components/schemas/Participation'
          nullable: true
          description: 'RN-02 (Tela 13): já traz o ponto de retomada permitido.'
        highlights:
          type: array
          description: Destaques do feed, mesmas regras de elegibilidade.
          items: { $ref: '#/components/schemas/FeedItem' }
        missions:
          type: array
          items: { $ref: '#/components/schemas/PlayerMission' }

    PlayerProgress:
      type: object
      required: [level, xp, feedbackQuality]
      properties:
        level: { type: integer }
        xp: { type: integer }
        xpToNextLevel: { type: integer }
        feedbackQuality:
          type: number
          format: float
          description: Nota de qualidade calculada no servidor.
        achievementsUnlocked: { type: integer }
        hoursPlayed: { type: number, format: float }
        testsCompleted: { type: integer }

    PlayerGame:
      type: object
      required: [game, openTests]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        playersTotal: { type: integer }
        openTests: { type: integer }
        maxRewardCents: { type: integer, nullable: true }
        specs: { $ref: '#/components/schemas/GameSpecs' }

    PlayerTest:
      type: object
      required: [testId, gameId, cta, disabled]
      allOf:
        - $ref: '#/components/schemas/FeedItem'
      properties:
        modelKey: { $ref: '#/components/schemas/TestModelKey' }
        participation:
          allOf:
            - $ref: '#/components/schemas/Participation'
          nullable: true

    PlayerTestList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PlayerTest' }
        nextCursor: { type: string, nullable: true }

    # ---- participations / sessions ----
    Participation:
      type: object
      required: [id, testId, status]
      properties:
        id: { type: string, format: uuid }
        testId: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ParticipationStatus' }
        currentSessionId: { type: string, format: uuid, nullable: true }
        resumePoint:
          type: string
          nullable: true
          description: 'RN-02 (Tela 13): ponto de retomada permitido pelo modelo.'
        consentsGranted: { type: boolean }
        build: { $ref: '#/components/schemas/Build' }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    ParticipationList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participation' }
        nextCursor: { type: string, nullable: true }

    Tutorial:
      type: object
      required: [modelKey, steps, requiredConsents]
      properties:
        modelKey: { $ref: '#/components/schemas/TestModelKey' }
        steps:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              body: { type: string }
              mediaUrl: { type: string, format: uri, nullable: true }
        requiredConsents:
          type: array
          description: Consentimentos obrigatórios para este modelo.
          items: { $ref: '#/components/schemas/ConsentKind' }

    ConsentKind:
      type: string
      enum: [screen_recording, audio, microphone, webcam]

    ConsentRequest:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items:
            type: object
            required: [kind, granted]
            properties:
              kind: { $ref: '#/components/schemas/ConsentKind' }
              granted: { type: boolean }

    ConsentRecord:
      type: object
      required: [participationId, consents, recordedAt]
      properties:
        participationId: { type: string, format: uuid }
        consents:
          type: array
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/ConsentKind' }
              granted: { type: boolean }
        recordedAt: { type: string, format: date-time }
        allRequiredGranted:
          type: boolean
          description: 'RN-01 (Tela 17): a gravação só começa quando isto é `true`.'

    StartSessionRequest:
      type: object
      required: [buildVersion, platform]
      properties:
        buildVersion: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        deviceInfo: { type: object, additionalProperties: true }

    SessionStarted:
      type: object
      required: [sessionId, startedAt]
      properties:
        sessionId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        maxDurationMs: { type: integer, nullable: true }
        heartbeatIntervalMs: { type: integer }
        recordingRequired: { type: boolean }

    Session:
      type: object
      required: [id, participationId, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        participationId: { type: string, format: uuid }
        testId: { type: string, format: uuid }
        status:
          type: string
          enum: [active, finishing, in_review, valid, invalid, abandoned]
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        invalidReason: { type: string, nullable: true }

    DeviceEventRequest:
      type: object
      required: [kind, enabled, tMs]
      properties:
        kind: { type: string, enum: [microphone, webcam] }
        enabled: { type: boolean }
        tMs:
          type: integer
          description: |
            'RN-04 (Tela 17): milissegundos desde o início da sessão. Mesma base
            temporal do vídeo.'

    HeartbeatRequest:
      type: object
      required: [tMs]
      properties:
        tMs: { type: integer }
        connectionQuality: { type: string, enum: [good, degraded, poor] }

    FinishSessionRequest:
      type: object
      required: [tMs, confirmed]
      properties:
        tMs: { type: integer }
        confirmed:
          type: boolean
          enum: [true]
          description: 'RN-03 (Tela 17): evita encerramento acidental.'
        reason: { type: string, enum: [completed, gave_up, technical_failure] }

    SessionSummary:
      type: object
      required: [session, test, game, form]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        test: { $ref: '#/components/schemas/PlayerTest' }
        game: { $ref: '#/components/schemas/Game' }
        recording: { $ref: '#/components/schemas/PlaybackUrlResponse' }
        form: { $ref: '#/components/schemas/TestForm' }
        alreadySubmitted:
          type: boolean
          description: 'RN-03 (Tela 18): `true` bloqueia novo envio.'

    FormResponseRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: '#/components/schemas/AnswerInput' }

    AnswerInput:
      type: object
      required: [questionId, value]
      properties:
        questionId: { type: string, format: uuid }
        value:
          description: |
            Texto, número, booleano ou lista de ids de opção, conforme o tipo da
            pergunta.
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: array, items: { type: string } }

    FormResponse:
      type: object
      required: [id, sessionId, submittedAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }

    ParticipationResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_review, completed, rejected]
          description: |
            'RN-02 (Tela 19): enquanto `in_review`, os valores abaixo vêm nulos.
            Não exiba número provisório.'
        xpEarned: { type: integer, nullable: true }
        level: { type: integer, nullable: true }
        feedbackQuality: { type: number, format: float, nullable: true }
        rating: { type: number, format: float, nullable: true }
        achievementsUnlocked:
          type: array
          items: { $ref: '#/components/schemas/Achievement' }
        rewardCents:
          type: integer
          nullable: true
          description: Informativo. O crédito em carteira está deferido.
        rewardStatus:
          type: string
          enum: [pending, credited, rejected]
          description: Permanece `pending` enquanto a carteira não existir.
        rejectedReason: { type: string, nullable: true }

    # ---- media ----
    RecordingUploadUrlRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType: { type: string, example: video/webm }
        sizeBytes: { type: integer, minimum: 1 }
        partNumber:
          type: integer
          minimum: 1
          description: Presente em envio multipart.
        uploadId: { type: string, description: Devolvido na primeira parte. }

    RecordingCompleteRequest:
      type: object
      required: [storageKey, durationMs]
      properties:
        storageKey: { type: string }
        durationMs: { type: integer }
        sizeBytes: { type: integer }
        uploadId: { type: string }
        parts:
          type: array
          items:
            type: object
            properties:
              partNumber: { type: integer }
              etag: { type: string }

    Recording:
      type: object
      required: [id, sessionId, status]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        durationMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    PlaybackUrlResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        url:
          type: string
          format: uri
          nullable: true
          description: 'Nulo quando `status` não é `ready`.'
        expiresAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }

    # ---- reports ----
    ReportBlock:
      type: object
      description: |
        Unidade do relatório. Cada bloco carrega o próprio `status`, para que um
        bloco em erro ou ainda processando não derrube a página — e para que
        telemetria e insights de IA entrem depois como blocos novos.
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        data:
          nullable: true
          description: 'Presente apenas quando `status` é `ready`.'
        message: { type: string, nullable: true }

    TestReport:
      type: object
      required: [testId, stage, blocks]
      properties:
        testId: { type: string, format: uuid }
        stage:
          type: string
          enum: [none, partial, final]
          description: |
            'RN-02 (Tela 05): `partial` enquanto o teste corre; `final` só com o
            processamento concluído.'
        blocks:
          type: object
          properties:
            summary: { $ref: '#/components/schemas/ReportBlock' }
            evolution: { $ref: '#/components/schemas/ReportBlock' }
            ratings: { $ref: '#/components/schemas/ReportBlock' }
            testers: { $ref: '#/components/schemas/ReportBlock' }

    SessionListItem:
      type: object
      required: [id, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        playerDisplayName: { type: string }
        status: { type: string }
        durationMs: { type: integer, nullable: true }
        rating: { type: number, format: float, nullable: true }
        hasRecording: { type: boolean }
        startedAt: { type: string, format: date-time }

    SessionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SessionListItem' }
        nextCursor: { type: string, nullable: true }

    SessionDetail:
      type: object
      required: [session, blocks]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        player:
          type: object
          properties:
            displayName: { type: string }
            level: { type: integer }
            feedbackQuality: { type: number, format: float }
            archetype: { type: string, nullable: true }
        blocks:
          type: object
          description: |
            Mesma estrutura de blocos do relatório. Transcrição, telemetria e
            insights entram aqui quando saírem do escopo deferido.
          properties:
            recording: { $ref: '#/components/schemas/ReportBlock' }
            deviceEvents: { $ref: '#/components/schemas/ReportBlock' }
            formResponse: { $ref: '#/components/schemas/ReportBlock' }

    RateSessionRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }
        markInvalid:
          type: boolean
          default: false
          description: |
            'RN-01 (Tela 11): sessão inválida sai das métricas do relatório.'
        invalidReason: { type: string }

    SessionRating:
      type: object
      required: [sessionId, rating, ratedAt]
      properties:
        sessionId: { type: string, format: uuid }
        rating: { type: integer }
        comment: { type: string, nullable: true }
        ratedAt: { type: string, format: date-time }

    ExportResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        jobId: { type: string, format: uuid, nullable: true }
        url: { type: string, format: uri, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    # ---- dashboard ----
    StudioDashboard:
      type: object
      required: [kpis, games, recentTests]
      properties:
        kpis:
          type: object
          description: |
            'RN-02 (Tela 02): consolidados no backend. A UI não recalcula.'
          additionalProperties:
            type: object
            properties:
              value: { type: number }
              delta: { type: number, nullable: true }
              unit: { type: string, nullable: true }
        games:
          type: array
          items: { $ref: '#/components/schemas/Game' }
        recentTests:
          type: array
          items: { $ref: '#/components/schemas/Test' }
        stats: { $ref: '#/components/schemas/ReportBlock' }

    # ---- gamification ----
    Achievement:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: string, format: uri, nullable: true }

    PlayerAchievement:
      type: object
      required: [achievement, unlocked]
      properties:
        achievement: { $ref: '#/components/schemas/Achievement' }
        unlocked: { type: boolean }
        unlockedAt: { type: string, format: date-time, nullable: true }
        progress: { type: number, format: float, nullable: true }

    PlayerAchievementList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PlayerAchievement' }
        nextCursor: { type: string, nullable: true }

    PlayerMission:
      type: object
      required: [key, name, progress, target]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        progress: { type: integer }
        target: { type: integer }
        rewardXp: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    RankingEntry:
      type: object
      required: [position, displayName, score]
      properties:
        position: { type: integer }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        level: { type: integer }
        score: { type: number }
        isCurrentUser: { type: boolean }

    RankingList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RankingEntry' }
        nextCursor: { type: string, nullable: true }
        currentUserEntry:
          allOf:
            - $ref: '#/components/schemas/RankingEntry'
          nullable: true
        generatedAt:
          type: string
          format: date-time
          description: Snapshot materializado, não cálculo em tempo real.

    # ---- community ----
    CommunityPost:
      type: object
      required: [id, gameId, body, authorDisplayName, createdAt, status]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        authorUserId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        body: { type: string }
        status: { type: string, enum: [visible, hidden, pinned] }
        createdAt: { type: string, format: date-time }

    CommunityPostList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CommunityPost' }
        nextCursor: { type: string, nullable: true }

    CreateCommunityPostRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    Review:
      type: object
      required: [id, gameId, rating, authorDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        authorUserId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ReviewList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        nextCursor: { type: string, nullable: true }
        averageRating: { type: number, format: float, nullable: true }

    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 5000 }

    # ---- notifications ----
    Notification:
      type: object
      required: [id, type, title, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: session.validated }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: string, nullable: true }
        unreadCount: { type: integer }
